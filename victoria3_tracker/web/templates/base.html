<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Victoria 3 Game Tracker{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('dashboard') }}">
                <i class="fas fa-globe"></i> Victoria 3 Tracker
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}" 
                           href="{{ url_for('dashboard') }}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'countries' %}active{% endif %}" 
                           href="{{ url_for('countries') }}">Countries</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'rankings' %}active{% endif %}" 
                           href="{{ url_for('rankings') }}">Rankings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'saves' %}active{% endif %}" 
                           href="{{ url_for('saves') }}">Saves</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'wars' %}active{% endif %}"
                           href="{{ url_for('wars') }}">Wars</a>
                    </li>
                </ul>
                
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'configuration' %}active{% endif %}" 
                           href="{{ url_for('configuration') }}">
                            <i class="fas fa-cog"></i> Settings
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'system_status' %}active{% endif %}" 
                           href="{{ url_for('system_status') }}">
                            <i class="fas fa-heartbeat"></i> Status
                        </a>
                    </li>
                </ul>
                
                <div class="navbar-text">
                    <span id="connection-status" class="badge bg-secondary">Connecting...</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div id="alerts-container"></div>
        
        {% block content %}{% endblock %}
    </div>

    <footer class="bg-light text-center text-muted py-3 mt-5">
        <div class="container">
            <small>Victoria 3 Game Tracker v1.0.0 | 
                Last updated: <span id="last-update">Loading...</span>
            </small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/your-fontawesome-kit.js" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/export.js') }}"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
